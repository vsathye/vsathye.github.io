<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basic Leaflet Map</title>
    <!-- Leaflet CSS -->
    <link 
        rel="stylesheet" 
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" 
        integrity="sha512-o8fUm7HuuWBmImZh5iTz8hmCEgNnV39toNBohoXoxmI9EujaXWbA6Ijjkh2FNrtNpA71YNa7BJNKCR7g1BT8ow==" 
        crossorigin=""
    />
    <style>
        /* Set map height and width */
        #map {
            height: 500px;
            width: 100%;
        }
    </style>
</head>
<body>
    <h1>My Basic Leaflet Map</h1>
    <div id="map"></div>
    <!-- Leaflet JS -->
    <script 
        src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" 
        integrity="sha512-vtT26l29EcED65oSKsWJxGrspcRWgWfIwtrq9jX8pY4jsAH5UeHeFQFcVFxj6Lg5UXgLkKq27I6l3utXUHTSow==" 
        crossorigin=""
    ></script>
    <script>
        // Initialize the map and set its view to the desired geographical coordinates and zoom level
        var map = L.map('map').setView([51.505, -0.09], 13);

        // Add OpenStreetMap tiles to the map
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© OpenStreetMap contributors'
        }).addTo(map);

        // Add a marker to the map at a specific location
        var marker = L.marker([51.505, -0.09]).addTo(map);
        marker.bindPopup("<b>Hello world!</b><br>I am a popup.").openPopup();

        // Add a circle to the map
        var circle = L.circle([51.508, -0.11], {
            color: 'red',
            fillColor: '#f03',
            fillOpacity: 0.5,
            radius: 500
        }).addTo(map);
        circle.bindPopup("I am a circle.");

        // Add a polygon to the map
        var polygon = L.polygon([
            [51.509, -0.08],
            [51.503, -0.06],
            [51.51, -0.047]
        ]).addTo(map);
        polygon.bindPopup("I am a polygon.");
    </script>
</body>
</html>
