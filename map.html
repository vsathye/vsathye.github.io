<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive World Map</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            overflow: hidden;
            height: 100%;
        }
        #map-container {
            width: 100vw;
            height: 100vh;
            position: relative;
        }
        #world-map {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            transition: transform 0.1s ease;
        }
        #controls {
            position: absolute;
            top: 10px;
            left: 10px;
            z-index: 10;
            background: rgba(255,255,255,0.7);
            padding: 10px;
            border-radius: 5px;
        }
        #controls button {
            margin-right: 10px;
            padding: 5px 10px;
        }
    </style>
</head>
<body>
    <div id="controls">
        <button id="zoom-in">Zoom In (+)</button>
        <button id="zoom-out">Zoom Out (-)</button>
        <button id="reset-view">Reset View</button>
    </div>
    <div id="map-container">
        <object id="world-map" type="image/svg+xml" data="worldmap.svg">
            Your browser does not support SVG
        </object>
    </div>

    <script>
        const mapContainer = document.getElementById('map-container');
        const worldMap = document.getElementById('world-map');
        const zoomInBtn = document.getElementById('zoom-in');
        const zoomOutBtn = document.getElementById('zoom-out');
        const resetBtn = document.getElementById('reset-view');

        let scale = 1;
        let translateX = 0;
        let translateY = 0;
        let isPanning = false;
        let lastX = 0;
        let lastY = 0;

        // Wait for SVG to load
        worldMap.addEventListener('load', () => {
            const svgDoc = worldMap.contentDocument;
            const svgElement = svgDoc.documentElement;

            // Update map transform
            function updateTransform() {
                svgElement.style.transform = `scale(${scale}) translate(${translateX / scale}px, ${translateY / scale}px)`;
            }

            // Enforce map boundaries
            function enforceMapBounds() {
                const containerWidth = mapContainer.clientWidth;
                const containerHeight = mapContainer.clientHeight;
                const mapWidth = svgElement.getBoundingClientRect().width;
                const mapHeight = svgElement.getBoundingClientRect().height;

                const maxTranslateX = (mapWidth - containerWidth) / 2 / scale;
                const maxTranslateY = (mapHeight - containerHeight) / 2 / scale;

                translateX = Math.max(-maxTranslateX, Math.min(maxTranslateX, translateX));
                translateY = Math.max(-maxTranslateY, Math.min(maxTranslateY, translateY));
            }

            // Zoom functionality
            function zoom(delta, mouseX = null, mouseY = null) {
                const minZoom = 1;
                const maxZoom = 7;
                const oldScale = scale;
                scale = Math.max(minZoom, Math.min(maxZoom, scale + delta));

                if (mouseX !== null && mouseY !== null) {
                    const rect = svgElement.getBoundingClientRect();
                    const offsetX = (mouseX - rect.left) / oldScale;
                    const offsetY = (mouseY - rect.top) / oldScale;

                    translateX -= offsetX * (scale - oldScale);
                    translateY -= offsetY * (scale - oldScale);
                }

                enforceMapBounds();
                updateTransform();
            }

            // Trackpad and Mouse Wheel zoom/pan
            mapContainer.addEventListener('wheel', (e) => {
                e.preventDefault();
                if (e.ctrlKey || e.metaKey) {
                    const delta = e.deltaY > 0 ? -0.2 : 0.2;
                    zoom(delta, e.clientX, e.clientY);
                } else {
                    translateX -= e.deltaX;
                    translateY -= e.deltaY;
                    enforceMapBounds();
                    updateTransform();
                }
            });

            // Pan functionality
            mapContainer.addEventListener('pointerdown', (e) => {
                isPanning = true;
                lastX = e.clientX;
                lastY = e.clientY;
                mapContainer.style.cursor = 'grabbing';
            });

            mapContainer.addEventListener('pointermove', (e) => {
                if (!isPanning) return;

                const deltaX = e.clientX - lastX;
                const deltaY = e.clientY - lastY;

                translateX += deltaX;
                translateY += deltaY;

                enforceMapBounds();
                updateTransform();

                lastX = e.clientX;
                lastY = e.clientY;
            });

            mapContainer.addEventListener('pointerup', () => {
                isPanning = false;
                mapContainer.style.cursor = 'grab';
            });

            // Zoom in button
            zoomInBtn.addEventListener('click', () => {
                zoom(0.5);
            });

            // Zoom out button
            zoomOutBtn.addEventListener('click', () => {
                zoom(-0.5);
            });

            // Reset view button
            resetBtn.addEventListener('click', () => {
                scale = 1;
                translateX = 0;
                translateY = 0;
                updateTransform();
            });

            // Initial cursor style
            mapContainer.style.cursor = 'grab';
        });
    </script>
</body>
</html>
