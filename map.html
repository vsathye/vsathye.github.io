<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Historical Map Visualization</title>

    <!-- MapLibre GL JS -->
    <script src="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js"></script>
    <link href="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css" rel="stylesheet" />

    <!-- Add PapaParse for CSV handling -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.0/papaparse.min.js"></script>

    <link rel="stylesheet" href="src/css/map.css">
    <link rel="stylesheet" href="src/css/legend.css">
    <link rel="stylesheet" href="src/css/input.css">

    <script src="src/js/config/mapConfig.js"></script>
    <script src="src/js/config/interactionColors.js"></script>
    <script src="src/js/config/yearConfig.js"></script>
    <script src="src/js/components/map.js"></script>
</head>

<body>
    <div id="map">
        <div id="legend">
            <div class="legend-header">
                <span>Legend</span>
                <span class="expand-icon">▼</span>
            </div>
            <div class="legend-content">
                <div class="interaction-category" data-category="Diplomatic/Political">
                    <h4>Diplomatic/Political</h4>
                    <!-- Interactions will be populated here -->
                </div>
                <div class="interaction-category" data-category="Military/Conflict">
                    <h4>Military/Conflict</h4>
                    <!-- Interactions will be populated here -->
                </div>
                <div class="interaction-category" data-category="Economic">
                    <h4>Economic</h4>
                    <!-- Interactions will be populated here -->
                </div>
                <div class="interaction-category" data-category="Cultural">
                    <h4>Cultural</h4>
                    <!-- Interactions will be populated here -->
                </div>
            </div>
        </div>
    </div>
    <input type="text" id="yearInput" placeholder="Enter year..." />
    <script>

        const map = new maplibregl.Map(mapConfig);


        async function loadEntityData(entityName, year) {
            try {
                // Input validation
                if (!entityName || typeof entityName !== 'string') {
                    console.error('Invalid entityName:', entityName);
                    throw new Error(`Invalid entityName provided: ${entityName}`);
                }

                if (!year || typeof year !== 'number') {
                    console.error('Invalid year:', year);
                    throw new Error(`Invalid year provided: ${year}`);
                }

                // Format the entity name for the file path
                const formattedName = entityName.toLowerCase().replace(/\s+/g, '_');
                console.log(`Loading data for entity: ${formattedName}, year: ${year}`);

                // Fetch the CSV file
                const response = await fetch(`data/${formattedName}.csv`);
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                const csvText = await response.text();

                // Parse CSV data using PapaParse
                const parseResult = Papa.parse(csvText, {
                    header: true,
                    dynamicTyping: true,
                    skipEmptyLines: true
                });

                if (parseResult.errors && parseResult.errors.length > 0) {
                    console.error('CSV parsing errors:', parseResult.errors);
                }

                const parsedData = parseResult.data;
                console.log('Parsed data:', parsedData);

                if (!parsedData || parsedData.length === 0) {
                    throw new Error(`No data found for ${entityName}`);
                }

                // Find the entry closest to the requested year
                const sortedData = parsedData
                    .map(row => ({
                        ...row,
                        yearDiff: Math.abs(row.year - year)
                    }))
                    .sort((a, b) => a.yearDiff - b.yearDiff);

                // Get the closest year's data
                const closestData = sortedData[0];
                console.log('Closest data found:', closestData);

                // Validate required fields
                if (!closestData.coordinates || !closestData.center) {
                    throw new Error(`Missing required fields for ${entityName}`);
                }

                // Parse coordinates and center from strings to arrays
                try {
                    const coordinates = JSON.parse(closestData.coordinates);
                    const center = JSON.parse(closestData.center);

                    // Return formatted data
                    return {
                        name: closestData.name || entityName,
                        year: closestData.year,
                        type: closestData.type || 'unknown',
                        color: closestData.color || '#808080',
                        coordinates: coordinates,
                        center: center
                    };
                } catch (parseError) {
                    console.error('Error parsing coordinates or center:', parseError);
                    throw new Error(`Invalid coordinate data for ${entityName}`);
                }
            } catch (error) {
                console.error(`Error loading data for ${entityName}:`, error);
                return null;
            }
        }

        async function fetchAllData(entityName, year) {
            const [worldResponse, entityData] = await Promise.all([
                fetch('https://raw.githubusercontent.com/nvkelso/natural-earth-vector/master/geojson/ne_110m_land.geojson'),
                loadEntityData(entityName, year)
            ]);

            const worldData = await worldResponse.json();
            return { worldData, entityData };
        }

        // Main update function
        async function writeEntity(entityName, year) {
            // Wait for map to be loaded
            if (!map.loaded()) {
                await new Promise(resolve => map.on('load', resolve));
            }

            const entityData = await loadEntityData(entityName, year);
            if (!entityData) return;

            // Create unique IDs for this entity
            const sourceId = `empire-${entityName}-${year}`;
            const fillLayerId = `empire-fill-${entityName}-${year}`;
            const borderLayerId = `empire-borders-${entityName}-${year}`;

            // Create GeoJSON for the empire
            const empireData = {
                type: 'FeatureCollection',
                features: [{
                    type: 'Feature',
                    geometry: {
                        type: 'Polygon',
                        coordinates: [entityData.coordinates]
                    },
                    properties: {
                        name: entityData.name,
                        type: entityData.type,
                        year: entityData.year,
                        isHistoricalEntity: true
                    }
                }]
            };

            // Only remove if this specific entity already exists
            if (map.getSource(sourceId)) {
                map.removeLayer(borderLayerId);
                map.removeLayer(fillLayerId);
                map.removeSource(sourceId);
            }

            // Add new source and layers
            map.addSource(sourceId, {
                type: 'geojson',
                data: empireData
            });

            // Add fill layer for the empire
            map.addLayer({
                id: fillLayerId,
                type: 'fill',
                source: sourceId,
                layout: {},
                paint: {
                    'fill-color': entityData.color,
                    'fill-opacity': 0.6
                }
            });

            // Add border layer for the empire
            map.addLayer({
                id: borderLayerId,
                type: 'line',
                source: sourceId,
                layout: {},
                paint: {
                    'line-color': entityData.color,
                    'line-width': 2,
                    'line-opacity': 0.8
                }
            });

            // Add hover effect
            map.on('mouseenter', fillLayerId, () => {
                map.getCanvas().style.cursor = 'pointer';
                map.setPaintProperty(fillLayerId, 'fill-opacity', 0.8);
            });

            map.on('mouseleave', fillLayerId, () => {
                map.getCanvas().style.cursor = '';
                map.setPaintProperty(fillLayerId, 'fill-opacity', 0.6);
            });

            // Add click handler
            map.on('click', fillLayerId, (e) => {
                const properties = e.features[0].properties;
                new maplibregl.Popup()
                    .setLngLat(e.lngLat)
                    .setHTML(`
                <h3>${properties.name}</h3>
                <p>Type: ${properties.type}</p>
                <p>Year: ${properties.year}</p>
            `)
                    .addTo(map);
            });

            // Return the IDs in case they're needed for later reference
            return {
                sourceId,
                fillLayerId,
                borderLayerId
            };
        }



        let visibleInteractionTypes = new Set(Object.keys(interactionColors));

        async function writeInteraction(year) {


            // Wait for map to be loaded
            if (!map.loaded()) {
                await new Promise(resolve => map.on('load', resolve));
            }

            try {
                // Fetch and parse the interactions CSV for the given year
                const response = await fetch(`data/interactions/${year}.csv`);
                if (!response.ok) {
                    throw new Error(`No interaction data found for year ${year}`);
                }

                const csvText = await response.text();
                const parseResult = Papa.parse(csvText, {
                    header: true,
                    dynamicTyping: true,
                    skipEmptyLines: true,
                    transform: (value) => value.trim(),
                    complete: function (results, file) {
                        console.log("Parsing complete:", results);
                    }
                });

                // Filter out rows with missing required fields
                const interactions = parseResult.data.filter(row =>
                    row.src && row.dst && row.type && row.explanation
                );

                // Get unique set of entities from both source and destination
                const uniqueEntities = new Set();
                interactions.forEach(interaction => {
                    uniqueEntities.add(interaction.src);
                    uniqueEntities.add(interaction.dst);
                });

                console.log("Writing entities for the following:", Array.from(uniqueEntities));

                // Write all entities first
                const entityPromises = Array.from(uniqueEntities).map(entity =>
                    writeEntity(entity, year)
                );

                // Wait for all entities to be written
                await Promise.all(entityPromises);
                console.log("All entities written, now drawing interactions");

                // Process each interaction
                for (const interaction of interactions) {
                    // Modify the writeInteraction function to respect visibility settings
                    // Add this check before creating each interaction line:

                    if (!visibleInteractionTypes.has(interaction.type)) {
                        continue;
                    }
                    const sourceId = `interaction-${interaction.src}-${interaction.dst}-${year}`;

                    // Load source and destination entity data
                    const sourceData = await loadEntityData(interaction.src, year);
                    const destData = await loadEntityData(interaction.dst, year);

                    if (!sourceData || !destData) {
                        console.warn(`Missing entity data for interaction between ${interaction.src} and ${interaction.dst}`);
                        continue;
                    }

                    // Get the interaction color based on type

                    // Remove existing interaction line if it exists
                    if (map.getSource(sourceId)) {
                        map.removeLayer(`${sourceId}-line`);
                        map.removeSource(sourceId);
                    }

                    // Create the line feature
                    const lineFeature = {
                        type: 'Feature',
                        geometry: {
                            type: 'LineString',
                            coordinates: [
                                sourceData.center,
                                destData.center
                            ]
                        },
                        properties: {
                            source: interaction.src,
                            destination: interaction.dst,
                            type: interaction.type,
                            explanation: interaction.explanation
                        }
                    };

                    // Add the line source
                    map.addSource(sourceId, {
                        type: 'geojson',
                        data: {
                            type: 'FeatureCollection',
                            features: [lineFeature]
                        }
                    });
                    const visible = visibleInteractionTypes.has(interaction.type);
                    // Add the line layer
                    map.addLayer({
                        id: `${sourceId}-line`,
                        type: 'line',
                        source: sourceId,
                        layout: {
                            'line-join': 'round',
                            'line-cap': 'round'
                        },
                        paint: {
                            'line-color': interactionColors[interaction.type] || '#888888',
                            'line-width': 2,
                            'line-dasharray': [2, 2] // Creates a dashed line
                        }
                    });

                    // Add click handler for the line
                    map.on('click', `${sourceId}-line`, (e) => {
                        const properties = e.features[0].properties;
                        new maplibregl.Popup()
                            .setLngLat(e.lngLat)
                            .setHTML(`
                        <h3>${properties.source} → ${properties.destination}</h3>
                        <p><strong>Type:</strong> ${properties.type}</p>
                        <p>${properties.explanation}</p>
                    `)
                            .addTo(map);
                    });

                    // Add hover effects
                    map.on('mouseenter', `${sourceId}-line`, () => {
                        map.getCanvas().style.cursor = 'pointer';
                        map.setPaintProperty(`${sourceId}-line`, 'line-width', 4);
                    });

                    map.on('mouseleave', `${sourceId}-line`, () => {
                        map.getCanvas().style.cursor = '';
                        map.setPaintProperty(`${sourceId}-line`, 'line-width', 2);
                    });
                }

                console.log("All interactions drawn");
            } catch (error) {
                console.error(`Error processing interactions for year ${year}:`, error);
            }
        }

        function clearMap() {
            // Get all source IDs
            const sources = map.getStyle().sources;

            // Iterate through all sources
            Object.keys(sources).forEach(sourceId => {
                // Skip the base world layer
                if (sourceId === 'world') return;

                // Get all layers that use this source
                const layers = map.getStyle().layers.filter(layer => layer.source === sourceId);

                // Remove each layer
                layers.forEach(layer => {
                    if (map.getLayer(layer.id)) {
                        map.removeLayer(layer.id);
                    }
                });

                // Remove the source
                if (map.getSource(sourceId)) {
                    map.removeSource(sourceId);
                }
            });
        }

        function yearChangeHandler(e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                const year = parseInt(e.target.value);
                if (isNaN(year) || year < yearConfig.min || year > yearConfig.max) {
                    yearInput.style.borderColor = 'red';
                    return;
                }
                yearInput.style.borderColor = '';
                clearMap();
                setTimeout(() => writeInteraction(year), 100);
            }
        }

        const yearInput = document.getElementById('yearInput');
        yearInput.addEventListener('keydown', yearChangeHandler);

        // Legend initialization and management
        const legend = document.getElementById('legend');
        const legendContent = legend.querySelector('.legend-content');
        const legendHeader = legend.querySelector('.legend-header');
        const expandIcon = legend.querySelector('.expand-icon');

        // Populate legend content
        Object.values(interactionCategories).forEach(category => {
            const categoryDiv = legend.querySelector(`[data-category="${category.title}"]`);
            category.types.forEach(type => {
                const typeDiv = document.createElement('div');
                typeDiv.className = 'interaction-type';
                typeDiv.innerHTML = `
            <input type="checkbox" class="interaction-checkbox" 
                   data-interaction-type="${type}" checked>
            <div class="interaction-line" style="background-color: ${interactionColors[type]}"></div>
            <span>${type.replace(/_/g, ' ')}</span>
        `;
                categoryDiv.appendChild(typeDiv);
            });
        });

        // Toggle legend expansion
        legendHeader.addEventListener('click', () => {
            legendContent.classList.toggle('expanded');
            expandIcon.textContent = legendContent.classList.contains('expanded') ? '▼' : '▶';
        });

        // Handle interaction visibility toggling
        legend.addEventListener('change', (e) => {
            if (e.target.classList.contains('interaction-checkbox')) {
                const interactionType = e.target.dataset.interactionType;
                if (e.target.checked) {
                    visibleInteractionTypes.add(interactionType);
                } else {
                    visibleInteractionTypes.delete(interactionType);
                }

                // Update visibility of existing interaction lines
                Object.keys(map.getStyle().sources).forEach(sourceId => {
                    if (sourceId.startsWith('interaction-')) {
                        const layerId = `${sourceId}-line`;
                        if (map.getLayer(layerId)) {
                            const properties = map.getSource(sourceId)._data.features[0].properties;
                            const visible = visibleInteractionTypes.has(properties.type);
                            map.setLayoutProperty(layerId, 'visibility', visible ? 'visible' : 'none');
                        }
                    }
                });
            }
        });

        // Add navigation controls
        map.addControl(new maplibregl.NavigationControl());
    </script>

</body>

</html>
