<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>World Capitals Map</title>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
        }
        #map {
            height: 100vh;
            width: 100%;
        }
    </style>
</head>
<body>
    <!-- Map Container -->
    <div id="map"></div>
    
    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // Initialize the map and set its view
        const map = L.map('map').setView([16.5388, 7.0], 3); // Latitude, Longitude, Zoom level

        // Add a tile layer without labels
        L.tileLayer('https://cartocdn_{s}.global.ssl.fastly.net/base-flatblue/{z}/{x}/{y}.png', {
            subdomains: 'abcd',
            maxZoom: 19
        }).addTo(map);

        // Function to load and add markers from CSV
        function loadCapitals() {
            // Fetch the CSV file
            fetch('capitals.csv')
                .then(response => response.text())
                .then(csvText => {
                    // Parse the CSV
                    const results = Papa.parse(csvText, {
                        header: true,
                        dynamicTyping: true,
                        skipEmptyLines: true
                    });

                    // Add markers for each capital
                    results.data.forEach(city => {
                        // Check if latitude and longitude are valid numbers
                        if (city.Latitude != null && city.Longitude != null) {
                            L.circleMarker([city.Latitude, city.Longitude], {
                                radius: 5,
                                fillColor: '#ff0000',
                                color: '#000',
                                weight: 1,
                                opacity: 1,
                                fillOpacity: 0.8
                            }).addTo(map)
                                .bindPopup(`<b>${city.Name}</b>`);
                        }
                    });
                })
                .catch(error => {
                    console.error('Error loading capitals:', error);
                });
        }

        // Load capitals when map is ready
        loadCapitals();
    </script>
</body>
</html>
