<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive World Map</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            overflow: hidden;
            height: 100%;
        }
        #map-container {
            width: 100vw;
            height: 100vh;
            position: relative;
            cursor: grab;
        }
        #world-map {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            transition: transform 0.1s ease;
        }
        #controls {
            position: absolute;
            top: 10px;
            left: 10px;
            z-index: 10;
            background: rgba(255, 255, 255, 0.7);
            padding: 10px;
            border-radius: 5px;
        }
        #controls button {
            margin-right: 10px;
            padding: 5px 10px;
        }
    </style>
</head>
<body>
    <div id="controls">
        <button id="zoom-in">Zoom In (+)</button>
        <button id="zoom-out">Zoom Out (-)</button>
        <button id="reset-view">Reset View</button>
    </div>
    <div id="map-container">
        <object id="world-map" type="image/svg+xml" data="worldmap.svg">
            Your browser does not support SVG
        </object>
    </div>

    <script>
        const mapContainer = document.getElementById('map-container');
        const worldMap = document.getElementById('world-map');
        const zoomInBtn = document.getElementById('zoom-in');
        const zoomOutBtn = document.getElementById('zoom-out');
        const resetBtn = document.getElementById('reset-view');

        let scale = 1;
        let translateX = 0;
        let translateY = 0;
        let isDragging = false;
        let startX, startY;

        // Wait for SVG to load
        worldMap.addEventListener('load', () => {
            const svgDoc = worldMap.contentDocument;
            const svgElement = svgDoc.documentElement;

            // Update map transform
            function updateTransform() {
                svgElement.style.transform = `translate(${translateX}px, ${translateY}px) scale(${scale})`;
                svgElement.style.transformOrigin = "0 0";
            }

            // Enforce map boundaries (optional, can be customized)
            function enforceMapBounds() {
                const containerWidth = mapContainer.clientWidth;
                const containerHeight = mapContainer.clientHeight;
                const scaledWidth = svgElement.getBoundingClientRect().width;
                const scaledHeight = svgElement.getBoundingClientRect().height;

                // Limit translation to prevent panning outside the map
                translateX = Math.max(containerWidth - scaledWidth, Math.min(translateX, 0));
                translateY = Math.max(containerHeight - scaledHeight, Math.min(translateY, 0));
            }

            // Zoom functionality
            function zoom(delta, centerX, centerY) {
                const prevScale = scale;
                scale = Math.max(1, Math.min(7, scale + delta));
                const scaleFactor = scale / prevScale;

                // Adjust translation to zoom into the center of the mouse
                translateX = centerX - (centerX - translateX) * scaleFactor;
                translateY = centerY - (centerY - translateY) * scaleFactor;

                enforceMapBounds();
                updateTransform();
            }

            // Zoom in button
            zoomInBtn.addEventListener('click', () => {
                zoom(0.25, mapContainer.clientWidth / 2, mapContainer.clientHeight / 2);
            });

            // Zoom out button
            zoomOutBtn.addEventListener('click', () => {
                zoom(-0.25, mapContainer.clientWidth / 2, mapContainer.clientHeight / 2);
            });

            // Reset view button
            resetBtn.addEventListener('click', () => {
                scale = 1;
                translateX = 0;
                translateY = 0;
                updateTransform();
            });

            // Mouse drag to pan
            mapContainer.addEventListener('mousedown', (e) => {
                isDragging = true;
                startX = e.clientX - translateX;
                startY = e.clientY - translateY;
                mapContainer.style.cursor = 'grabbing';
            });

            document.addEventListener('mousemove', (e) => {
                if (!isDragging) return;
                translateX = e.clientX - startX;
                translateY = e.clientY - startY;
                enforceMapBounds();
                updateTransform();
            });

            document.addEventListener('mouseup', () => {
                isDragging = false;
                mapContainer.style.cursor = 'grab';
            });

            // Scroll wheel zoom
            mapContainer.addEventListener('wheel', (e) => {
                e.preventDefault();
                const rect = mapContainer.getBoundingClientRect();
                const mouseX = e.clientX - rect.left;
                const mouseY = e.clientY - rect.top;
                const delta = e.deltaY > 0 ? -0.1 : 0.1;
                zoom(delta, mouseX, mouseY);
            });

            // Initial cursor style
            mapContainer.style.cursor = 'grab';
        });
    </script>
</body>
</html>
