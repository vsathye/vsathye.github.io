<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Historical Map Visualization</title>

    <!-- MapLibre GL JS -->
    <script src="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js"></script>
    <link href="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css" rel="stylesheet" />

    <!-- Add PapaParse for CSV handling -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.0/papaparse.min.js"></script>

    <link rel="stylesheet" href="src/css/map.css">
    <link rel="stylesheet" href="src/css/legend.css">
    <link rel="stylesheet" href="src/css/input.css">

</head>

<body>
    <div id="map">
        <div id="legend">
            <div class="legend-header">
                <span>Legend</span>
                <span class="expand-icon">▼</span>
            </div>
            <div class="legend-content">
                <div class="interaction-category" data-category="Diplomatic/Political">
                    <h4>Diplomatic/Political</h4>
                    <!-- Interactions will be populated here -->
                </div>
                <div class="interaction-category" data-category="Military/Conflict">
                    <h4>Military/Conflict</h4>
                    <!-- Interactions will be populated here -->
                </div>
                <div class="interaction-category" data-category="Economic">
                    <h4>Economic</h4>
                    <!-- Interactions will be populated here -->
                </div>
                <div class="interaction-category" data-category="Cultural">
                    <h4>Cultural</h4>
                    <!-- Interactions will be populated here -->
                </div>
            </div>
        </div>
    </div>
    <input type="text" id="yearInput" placeholder="Enter year..." />
    <script type="module">
        import { initializeApp } from './src/js/main.js';
        document.addEventListener('DOMContentLoaded', initializeApp);
    </script>

</body>

</html>
