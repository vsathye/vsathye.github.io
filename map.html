<!-- This file will serve as the main application page including:
// - Basic HTML structure for the application
// - Required meta tags and viewport settings
// - CSS stylesheet references
//   - Main stylesheet (styles.css)
//   - Slider styles (slider.css)
//   - Map styles (map.css)
//   - Modal styles (modal.css)
// - External library imports
//   - D3.js for visualization
//   - noUiSlider for timeline
// - Container structure for all components
// - JavaScript file imports in correct dependency order
-->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Interactive historical world map showing governments and their interactions from 5000 BC to 2025 AD">
    <title>Historical World Map</title>
    
    <!-- Stylesheets -->
    <link rel="stylesheet" href="assets/css/styles.css">
    <link rel="stylesheet" href="assets/css/slider.css">
    <link rel="stylesheet" href="assets/css/map.css">
    <link rel="stylesheet" href="assets/css/modal.css">
    
    <!-- External Libraries -->
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/noUiSlider/15.7.1/nouislider.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/noUiSlider/15.7.1/nouislider.min.js"></script>
</head>
<body>
    <!-- Main application containers -->
    <div id="app-container">
        <!-- Map visualization area -->
        <div id="map-container">
            <div id="map"></div>
            <div id="map-controls"></div>
            <div id="map-legend"></div>
        </div>
        
        <!-- Timeline controls -->
        <div id="timeline-container">
            <div id="time-slider"></div>
            <div id="time-labels"></div>
        </div>
        
        <!-- Information display areas -->
        <div id="info-panel"></div>
        <div id="modal-container"></div>
    </div>

    <!-- Configuration -->
    <script src="assets/js/config/constants.js"></script>
    <script src="assets/js/config/mapConfig.js"></script>

    <!-- Utilities -->
    <script src="assets/js/utils/dateUtils.js"></script>
    <script src="assets/js/utils/geoUtils.js"></script>
    <script src="assets/js/utils/dataUtils.js"></script>

    <!-- Services -->
    <script src="assets/js/services/dataLoader.js"></script>
    <script src="assets/js/services/stateManager.js"></script>

    <!-- Components -->
    <script src="assets/js/components/Map/Map.js"></script>
    <script src="assets/js/components/Map/Node.js"></script>
    <script src="assets/js/components/Map/Edge.js"></script>
    
    <script src="assets/js/components/Timeline/Slider.js"></script>
    <script src="assets/js/components/Timeline/Labels.js"></script>
    
    <script src="assets/js/components/UI/Modal.js"></script>
    <script src="assets/js/components/UI/Legend.js"></script>
    <script src="assets/js/components/UI/Controls.js"></script>

    <!-- Main application entry -->
    <script src="assets/js/main.js"></script>
</body>
</html>
