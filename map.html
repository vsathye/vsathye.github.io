<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Map</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
        }
        #container {
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #f0f0f0;
            overflow: hidden;
            position: relative;
        }
        svg {
            cursor: grab;
            user-select: none;
        }
        svg:active {
            cursor: grabbing;
        }
    </style>
</head>
<body>
    <div id="container">
        <svg id="map" xmlns="http://www.w3.org/2000/svg">
            <image href="worldmap.svg" x="0" y="0" width="2000" height="1000" />
        </svg>
    </div>

    <script>
        const svg = document.getElementById('map');
        let isDragging = false;
        let startX, startY;

        const originalWidth = 2000;
        const originalHeight = 1000;
        const maxZoom = 6; // Maximum zoom level
        const minZoom = 1; // Minimum zoom level

        let viewBoxX = 0, viewBoxY = 0, viewBoxWidth = originalWidth, viewBoxHeight = originalHeight;

        // Set the initial viewBox
        svg.setAttribute('viewBox', `${viewBoxX} ${viewBoxY} ${viewBoxWidth} ${viewBoxHeight}`);

        // Mouse down event to start dragging
        svg.addEventListener('mousedown', (e) => {
            isDragging = true;
            startX = e.clientX;
            startY = e.clientY;
        });

        // Mouse move event for dragging
        svg.addEventListener('mousemove', (e) => {
            if (isDragging) {
                const dx = (startX - e.clientX) * (viewBoxWidth / svg.clientWidth);
                const dy = (startY - e.clientY) * (viewBoxHeight / svg.clientHeight);

                viewBoxX += dx;
                viewBoxY += dy;

                svg.setAttribute('viewBox', `${viewBoxX} ${viewBoxY} ${viewBoxWidth} ${viewBoxHeight}`);

                startX = e.clientX;
                startY = e.clientY;
            }
        });

        // Mouse up event to stop dragging
        svg.addEventListener('mouseup', () => {
            isDragging = false;
        });

        // Mouse wheel event for zooming
        svg.addEventListener('wheel', (e) => {
            e.preventDefault();
            handleZoom(e.deltaY < 0 ? 1.1 : 1 / 1.1);
        });

        // Handle zoom (used for mouse and keyboard shortcuts)
        function handleZoom(scaleFactor) {
            const centerX = viewBoxX + viewBoxWidth / 2;
            const centerY = viewBoxY + viewBoxHeight / 2;

            let newWidth = viewBoxWidth * (1 / scaleFactor);
            let newHeight = viewBoxHeight * (1 / scaleFactor);

            // Constrain zoom to max and min levels
            if (newWidth < originalWidth / maxZoom || newWidth > originalWidth) {
                return;
            }

            viewBoxWidth = newWidth;
            viewBoxHeight = newHeight;

            // Adjust the viewBox to zoom on the center
            viewBoxX = centerX - viewBoxWidth / 2;
            viewBoxY = centerY - viewBoxHeight / 2;

            svg.setAttribute('viewBox', `${viewBoxX} ${viewBoxY} ${viewBoxWidth} ${viewBoxHeight}`);
        }

        // Reset the viewBox to original state
        function resetZoom() {
            viewBoxX = 0;
            viewBoxY = 0;
            viewBoxWidth = originalWidth;
            viewBoxHeight = originalHeight;

            svg.setAttribute('viewBox', `${viewBoxX} ${viewBoxY} ${viewBoxWidth} ${viewBoxHeight}`);
        }

        // Keyboard shortcuts for zoom and reset
        document.addEventListener('keydown', (e) => {
            if (e.key === '+') {
                handleZoom(1.1); // Zoom in
            } else if (e.key === '-') {
                handleZoom(1 / 1.1); // Zoom out
            } else if (e.key === 'r') {
                resetZoom(); // Reset zoom
            }
        });

        // Prevent text selection on drag
        svg.addEventListener('mouseleave', () => { isDragging = false; });
        svg.addEventListener('contextmenu', (e) => e.preventDefault());
    </script>
</body>
</html>
