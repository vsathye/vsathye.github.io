<?xml version="1.0" encoding="UTF-8"?>
<svg width="24" height="24" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
    <!-- Kingdom Marker (Square with Crown) -->
    <rect x="4" y="4" width="16" height="16" 
          fill="currentColor" 
          fill-opacity="0.2"
          stroke="currentColor" 
          stroke-width="2"/>
          
    <!-- Crown symbol -->
    <path d="M7 16l2.5-5 2.5 3 2.5-3 2.5 5H7z" 
          fill="currentColor"
          stroke="currentColor" 
          stroke-width="1"/>
          
    <!-- Selection ring -->
    <rect x="2" y="2" width="20" height="20" 
          class="selection-ring"
          stroke="currentColor" 
          stroke-width="2"
          fill="none"
          opacity="0"
          style="opacity: 0; transition: opacity 0.2s ease;"/>
</svg>